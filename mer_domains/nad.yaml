---
name: NAD

domain:
  minimum_latitude: 42.75000101154902
  maximum_latitude: 45.87500126317812
  minimum_longitude: 12.104167294929702
  maximum_longitude: 17.937500783409256
  resolution: 0.005208333333333333
  minimum_h_factor: 0.2
  vertical_levels:
    minimum_depth: 0.0
    maximum_depth: 300.0
    first_layer_thickness: 1


bathymetry:
  kind: "EMODnet"

actions:
  - action: SetDepth
    description: |
      Set the depth of all the cells that are shallower than 3 meters to exactly
      3 meters. We believe that this should guarantee a better behaviour
      around the coasts.
    where: everywhere
    args:
      value: 3.
      shallower_than: 3.

  - action: SetDepth
    description: |
      Deleting the Grado-Marano lagoon
    where: polygon
    args:
      wkt_file: ${MAIN_DIR}/polygons/nad_lagoons.csv
      polygon_name: Laguna_Grado_Marano
      value: 0.

  - action: IncludeExtBathy
    description: |
      Loads extra bathymetry datasets
    args:
      input_files:
        file1: /home/fabio/Trieste/PostDoc/bathytools/src/bathytools/bathymetry_sources/Batimetria_2003CORILA_shift_40-15.csv
        file2: /home/fabio/Trieste/PostDoc/bathytools/src/bathytools/bathymetry_sources/Bati_2013_coarsed.csv
        file3: /home/fabio/Trieste/PostDoc/bathytools/src/bathytools/bathymetry_sources/Planes_bathymetry_4326.csv
        file4: /home/fabio/Trieste/PostDoc/bathytools/src/bathytools/bathymetry_sources/Channels_bathymetry.csv
        file5: /home/fabio/Trieste/PostDoc/bathytools/src/bathytools/bathymetry_sourcesBatimetria.nc
      input_crs:
        file1: EPSG:3004
        file2: EPSG:3004
        file3: EPSG:4326
        file4: EPSG:3004
        file5: none
      window:
        file1:
          min_lon: 12.104167294929702
          max_lon: 12.65
          min_lat: 45.15
          max_lat: 45.65
        file2:
          min_lon: 12.104167294929702
          max_lon: 12.65
          min_lat: 45.15
          max_lat: 45.65
        file3:
          min_lon: 13.025
          max_lon: 13.490
          min_lat: 45.625
          max_lat: 45.790
        file4:
          min_lon: 13.025
          max_lon: 13.490
          min_lat: 45.625
          max_lat: 45.790
        file5:
          min_lon: 12.104167294929702
          max_lon: 17.937500783409256
          min_lat: 42.75000101154902
          max_lat: 45.87500126317812
      weights:
        file1: 30.
        file2: 20.
        file3: 25.
        file4: 25.
        file5: 15.
        orig: 10.

  - action: FixVolumesLagoons
    description: |
      Sets minimum depth and removes isolated ponds inside lagoons, then
      recomputes the depths to conserve the lagoons' volume
    args:
      polygons: /home/fabio/Trieste/PostDoc/bathytools/polygons/nad_lagoons.csv
      threshold: 
        Laguna_Venezia: 0.825
        Laguna_Grado_Marano: 0.500
      min_depth: 
        Laguna_Venezia: 2.70
        Laguna_Grado_Marano: 1.70
  
  - action: SetDepth
    description: |
      Set the depth of all the cells that are shallower than 2 meters to exactly
      2 meters. We believe that this should guarantee a better behaviour
      in the lagoons.
    where: everywhere
    args:
      value: 2.
      shallower_than: 2.
  
  - action: SetDepth
    description: |
      Extend land under Susac island since it is near the southern boundary
    where: slice
    args:
      min_lon: 16.497
      max_lon: 16.5391
      min_lat: 42.7526
      max_lat: 42.7578
      value: 0.

  - action: SetDepth
    description: |
      Extend land on a small cove of Lastovo island since it is near
      the southern boundary
    where: slice
    args:
      min_lon: 16.7838
      max_lon: 16.8047
      min_lat: 42.7526
      max_lat: 42.7631
      value: 0.

  - action: SetDepth
    description: |
      Extend land under small Otocici Vrhovnjaci island since it is near
