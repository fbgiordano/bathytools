      max_lat: 45.2915
      value: 0.

  - action: SetDepth
    description: |
      Extend land to close the Venice Lagoon, slice4
    where: slice
    args:
      min_lon: 12.3145
      max_lon: 12.3153
      min_lat: 45.3030
      max_lat: 45.3200
      value: 0.

  - action: SetDepth
    description: |
      Extend land to close the Venice Lagoon, slice5
    where: slice
    args:
      min_lon: 12.3200
      max_lon: 12.3208
      min_lat: 45.3137
      max_lat: 45.3302
      value: 0.

  - action: SetDepth
    description: |
      Extend land to close the Venice Lagoon, slice6
    where: slice
    args:
      min_lon: 12.3343
      max_lon: 12.3363
      min_lat: 45.3550
      max_lat: 45.3639
      value: 0.

  - action: SetDepth
    description: |
      Extend land to close the Venice Lagoon, slice7
    where: slice
    args:
      min_lon: 12.3558
      max_lon: 12.3586
      min_lat: 45.3859
      max_lat: 45.3950
      value: 0.

  - action: DigChannel
    description: Deleting small island south-east of Cesvinica
    args:
      start_point:
        lat: 42.7630
        lon: 16.9921
      end_point:
        lat: 42.7630
        lon: 17.0027
      width: 800

  - action: DigChannel
    description: Deleting a zonal part of Broce peninsula
    args:
      start_point:
        lat: 42.763
        lon: 17.7526
      end_point:
        lat: 42.763
        lon: 17.7787
      width: 800

  - action: DigChannel
    description: Deleting a meridional part of Broce peninsula
    args:
      start_point:
        lat: 42.7735
        lon: 17.7786
      end_point:
        lat: 42.7526
        lon: 17.7787
      width: 800

  - action: DigChannel
    description: Separating Krk island
    args:
      start_point:
        lat: 45.25265
        lon: 14.5494
      end_point:
        lat: 45.2161
        lon: 14.60158
      width: 800

  - action: RemoveDetachedCells
    description: Keep only the biggest connected component

  - action: DigRivers
    description: Dig the stems for the rivers
    args:
      main_file: ${MAIN_DIR}/mer_domains/rivers/main.json

  - action: RemoveTrappedWater
    description: Remove the water cells on the boundary that are close to land

  - action: SetDepth
    description: |
      Adding northern Po stem
    where: slice
    args:
      min_lon: 12.411
      max_lon: 12.417
      min_lat: 44.96615
      max_lat: 45.05
      value: 6.0

  - action: SetDepth
    description: |
      Adding southern Po stem
    where: slice
    args:
      min_lon: 12.38
      max_lon: 12.39
      min_lat: 44.767
      max_lat: 44.96615
      value: 6.0

  - action: WriteBlankTiles
    description: Write a list of tiles that do not contain water
    args:
      file_name: data.exch2_NAD
      size_tiles_lon: 20
      size_tiles_lat: 30

filters:
  - filter: RemoveStagnations
    description: Removes bottom water cells surrounded by land
